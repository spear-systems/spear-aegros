name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      # Rolldown (Vitest/Vite) and Rollup (Vite build) ship platform optionalDependencies; npm ci + workspaces often omit them.
      - name: Ensure Rolldown and Rollup native bindings
        shell: bash
        run: |
          set -e
          RVER=$(node -p "require('rolldown/package.json').version")
          UVER=$(node -p "require('rollup/package.json').version")
          case "${{ runner.os }}" in
            Linux)
              npm install "@rolldown/binding-linux-x64-gnu@${RVER}" --no-save
              npm install "@rollup/rollup-linux-x64-gnu@${UVER}" --no-save
              ;;
            Windows)
              npm install "@rolldown/binding-win32-x64-msvc@${RVER}" --no-save
              npm install "@rollup/rollup-win32-x64-msvc@${UVER}" --no-save
              ;;
            macOS)
              if [ "$(uname -m)" = arm64 ]; then
                npm install "@rolldown/binding-darwin-arm64@${RVER}" --no-save
                npm install "@rollup/rollup-darwin-arm64@${UVER}" --no-save
              else
                npm install "@rolldown/binding-darwin-x64@${RVER}" --no-save
                npm install "@rollup/rollup-darwin-x64@${UVER}" --no-save
              fi
              ;;
          esac

      # type-aware ESLint needs built workspace types (exports point at dist/) and generated Prisma client
      - name: Prepare for lint (core dist + Prisma client)
        run: npm run build -w @spearsystems/aegros-core && npm run db:generate -w @spearsystems/aegros-server
        env:
          DATABASE_URL: file:./packages/aegros-server/prisma/ci-placeholder.db

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: SBOM (CycloneDX)
        if: matrix.os == 'ubuntu-latest'
        run: npm run sbom
