name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      # Rolldown (Vitest/Vite) + Rollup (Vite build): optional native deps often missing after npm ci in workspaces.
      - name: Ensure Rolldown and Rollup native bindings
        run: node scripts/ensure-native-bindings.mjs

      # type-aware ESLint needs built workspace types (exports point at dist/) and generated Prisma client
      - name: Prepare for lint (core dist + Prisma client)
        run: npm run build -w @spearsystems/aegros-core && npm run db:generate -w @spearsystems/aegros-server
        env:
          DATABASE_URL: file:./packages/aegros-server/prisma/ci-placeholder.db

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Re-apply in case any intermediate step touched node_modules (Vitest loads rolldown at startup).
      - name: Ensure native bindings (pre-test)
        run: node scripts/ensure-native-bindings.mjs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: SBOM (CycloneDX)
        if: matrix.os == 'ubuntu-latest'
        run: npm run sbom
