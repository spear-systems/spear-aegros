name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      # Vite 8 → rolldown uses platform optionalDependencies; npm ci + workspaces can omit them (Vitest then fails at startup).
      - name: Ensure Rolldown native binding
        shell: bash
        run: |
          set -e
          RVER=$(node -p "require('rolldown/package.json').version")
          case "${{ runner.os }}" in
            Linux) npm install "@rolldown/binding-linux-x64-gnu@${RVER}" --no-save ;;
            Windows) npm install "@rolldown/binding-win32-x64-msvc@${RVER}" --no-save ;;
            macOS)
              if [ "$(uname -m)" = arm64 ]; then npm install "@rolldown/binding-darwin-arm64@${RVER}" --no-save
              else npm install "@rolldown/binding-darwin-x64@${RVER}" --no-save; fi
              ;;
          esac

      # type-aware ESLint needs built workspace types (exports point at dist/) and generated Prisma client
      - name: Prepare for lint (core dist + Prisma client)
        run: npm run build -w @spearsystems/aegros-core && npm run db:generate -w @spearsystems/aegros-server
        env:
          DATABASE_URL: file:./packages/aegros-server/prisma/ci-placeholder.db

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: SBOM (CycloneDX)
        if: matrix.os == 'ubuntu-latest'
        run: npm run sbom
